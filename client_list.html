<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client List</title>
</head>
<body>
    <h2>Our Valued Clients</h2>
    <p><a href="home page.html">Back to Home</a></p>

    <input type="text" id="searchClient" onkeyup="filterClients()" placeholder="Search clients...">

    <ol id="clients">
        <li>Acme Corporation</li>
        <li>Beta Industries</li>
        <li>Delta Global</li>
        <li>Omega Tech</li>
    </ol>

    <script>
        function filterClients() {
            const input = document.getElementById("searchClient").value.toLowerCase();
            const listItems = document.getElementById("clients").getElementsByTagName("li");

            for (let i = 0; i < listItems.length; i++) {
                const text = listItems[i].textContent || listItems[i].innerText;
                if (text.toLowerCase().indexOf(input) > -1) {
                    listItems[i].style.display = "";
                } else {
                    listItems[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
