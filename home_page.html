    <script>
        // समय के अनुसार यूज़र को ग्रीट करना
        const hours = new Date().getHours();
        const msgElement = document.getElementById("welcomeMessage");
        if (hours < 12) {
            msgElement.textContent = "Good Morning! Explore our awesome services.";
        } else if (hours < 18) {
            msgElement.textContent = "Good Afternoon! Glad to have you here.";
        } else {
            msgElement.textContent = "Good Evening! Hope you are having a great day.";
        }
    </script>
