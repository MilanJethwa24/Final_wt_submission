<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>
    <h2>Contact Us</h2>
    <p><a href="home page.html">Back to Home</a></p>

    <form id="contactForm" onsubmit="handleContact(event)">
        <input type="text" id="contactName" placeholder="Your Name" required><br><br>
        <input type="email" id="contactEmail" placeholder="Your Email" required><br><br>
        <button type="submit">Send Message</button>
    </form>

    <script>
        function handleContact(event) {
            event.preventDefault();
            const name = document.getElementById("contactName").value;
            
            alert(`Thank you, ${name}! Your message has been received. We will get back to you soon.`);
            document.getElementById("contactForm").reset(); // फॉर्म क्लियर करना
        }
    </script>
</body>
</html>
